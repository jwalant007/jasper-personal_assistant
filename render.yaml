services:
  - type: web
    name: jasper-personal-assistant
    runtime: node
    plan: free
    region: oregon
    buildCommand: ./render-build.sh
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
