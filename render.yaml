services:
  - type: web
    name: jasper-personal-assistant
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install-all && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
