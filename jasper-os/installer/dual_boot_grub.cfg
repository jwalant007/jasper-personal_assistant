# ==============================================================================
# Jasper OS — Master GRUB 2 Dual-Boot Configuration Template
# Target: UEFI x86_64 Laptop (Windows 11 + Jasper OS)
# ==============================================================================

set default="0"
set timeout=5
set timeout_style=menu

# Color and Theme Configuration
set color_normal=light-gray/black
set color_highlight=cyan/black

# Load EFI modules
insmod efi_gop
insmod efi_uga
insmod font
insmod gfxterm
insmod part_gpt
insmod ext2
insmod fat
insmod ntfs

terminal_output gfxterm

# ------------------------------------------------------------------------------
# Entry 1: Jasper OS (Default)
# ------------------------------------------------------------------------------
menuentry "Jasper OS (Linux 6.6 LTS) - High Performance" --class jasper --class linux --id jasper-os {
    search --no-floppy --set=root --label JASPER_ROOT
    linux /boot/vmlinuz-6.6-jasper root=LABEL=JASPER_ROOT ro quiet splash intel_pstate=active i915.enable_guc=3
    initrd /boot/initrd.img-6.6-jasper
}

# ------------------------------------------------------------------------------
# Entry 2: Windows 11 Boot Manager (Auto-detected via EFI System Partition)
# ------------------------------------------------------------------------------
menuentry "Windows 11" --class windows --class os --id windows-11 {
    search --no-floppy --set=root --file /EFI/Microsoft/Boot/bootmgfw.efi
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}

# ------------------------------------------------------------------------------
# Entry 3: Jasper OS Recovery / Safe Mode
# ------------------------------------------------------------------------------
menuentry "Jasper OS (Safe / Fallback Mode)" --class jasper --class recovery --id jasper-recovery {
    search --no-floppy --set=root --label JASPER_ROOT
    linux /boot/vmlinuz-6.6-jasper root=LABEL=JASPER_ROOT ro nomodeset single
    initrd /boot/initrd.img-6.6-jasper
}

# ------------------------------------------------------------------------------
# Entry 4: Laptop UEFI Firmware Settings
# ------------------------------------------------------------------------------
menuentry "UEFI Firmware Settings (BIOS)" --class efi --id uefi-firmware {
    fwsetup
}
